bundle:
  name: lead-score

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "lead-score"
      description: "Lead Score: fila do dia priorizada por IA + agente Genie"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      profile: pessoal

    variables:
      sql_warehouse_id: a50e6a998ebe9440
      genie_space_id: 01f1e3b065c41d71a4ddeb2a23edbf7a
      genie_space_name: Lead Score · Agente comercial
