# M0 · prepara schemas, volumes e a tabela de feedback (idempotente)
resources:
  jobs:
    lead_score_setup:
      name: lead_score_setup
      tasks:
        - task_key: ambiente
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/setup/00_ambiente.sql
        - task_key: teste_ai
          depends_on:
            - task_key: ambiente
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/setup/00_teste_ai.sql
